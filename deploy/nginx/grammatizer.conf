# Reference Nginx config for The Great Automatic Grammatizator.
# Not applied to any live server — adapt the paths/domain below and drop into
# /etc/nginx/sites-available/ (or your SpinupWP-managed equivalent) when deploying.
#
# Serves frontend/ as static files and reverse-proxies /api/ to uvicorn on 127.0.0.1:8000.
# Plain HTTP/JSON throughout — no WebSocket upgrade headers needed (simpler than the
# Streamlit prototype this replaced).

server {
    listen 80;
    listen [::]:80;
    server_name grammatizer.example.com;

    root /var/www/grammatizer/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # TLS: run certbot once DNS points at the VPS — it will add a :443 server block
    # and an HTTP->HTTPS redirect here automatically.
}
