# Reference Nginx config for The Great Automatic Grammatizator.
# Not applied to any live server — adapt the paths/domain below and drop into
# /etc/nginx/sites-available/ (or your SpinupWP-managed equivalent) when deploying.
#
# Serves the repo's static frontend files (index.html, css/, js/, assets/ — all at
# repo root, no frontend/ subfolder) and reverse-proxies /api/ to uvicorn on
# 127.0.0.1:8000. Plain HTTP/JSON throughout — no WebSocket upgrade headers needed
# (simpler than the Streamlit prototype this replaced).

server {
    listen 80;
    listen [::]:80;
    server_name grammatizer.example.com;

    # Cleanest option: point this at a directory that only ever received the public
    # files (index.html, css/, js/, assets/) -- e.g. via `rsync --exclude` from the
    # repo, not `root` pointed straight at a full git checkout. If you do deploy
    # straight from the repo (simplest for a small project like this), the deny
    # rules below are load-bearing, not optional -- they're what stops backend
    # source, deploy configs, and repo/dev files from becoming publicly servable
    # now that there's no frontend/ subfolder boundary separating them.
    root /var/www/grammatizer;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location ~ ^/(backend|deploy|docs|\.git|\.claude)(/|$) {
        deny all;
        return 404;
    }
    location ~ /\.(env.*|DS_Store|gitignore)$ {
        deny all;
        return 404;
    }
    location = /README.md { deny all; return 404; }
    location = /serve.py { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # TLS: run certbot once DNS points at the VPS — it will add a :443 server block
    # and an HTTP->HTTPS redirect here automatically.
}
